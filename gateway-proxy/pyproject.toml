[project]
name = "gateway-proxy"
version = "0.1.0"
description = "fx-style AI Gateway proxy - OpenAI <-> AI SDK v3 protocol converter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Make the project root importable so `uv run pytest tests/` can resolve
# the `converter` package and `server` (pytest console scripts do not add cwd).
pythonpath = ["."]
